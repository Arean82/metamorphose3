[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metamorphose3"
version = "3.0.0"
description = "A mass renamer for files and folders."
readme = "README.rst"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Arean", email = "arean@synorastudio.in" }
]
dependencies = [
    "wxPython>=4.2.0,<5.0.0",
    "Pillow>=9.0.0,<13.0.0",
    "exifread>=3.0.0,<4.0.0",
    "mutagen>=1.45.0,<2.0.0",
    "pymediainfo>=6.0.0,<7.0.0",
]

[project.scripts]
metamorphose3 = "metamorphose3:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.ico", "*.html", "*.txt", "*.ini", "*.cfg", "version", "icons/*", "help/*", "help/**/*"]
